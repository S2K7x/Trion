version: "3.8"

# n8n 2.x — configuration production (Raspberry Pi / serveur local)
#
# Résout le problème "Module 'crypto' is disallowed" :
#   NODE_FUNCTION_ALLOW_BUILTIN doit être présent sur n8n-main ET n8n-worker
#   (en queue mode, les Code nodes s'exécutent sur le worker)
#
# Usage :
#   cp .env.n8n.example .env.n8n
#   # remplir .env.n8n
#   docker compose -f docker-compose.prod.yml --env-file .env.n8n up -d
#
# Mise à jour :
#   docker compose -f docker-compose.prod.yml --env-file .env.n8n pull
#   docker compose -f docker-compose.prod.yml --env-file .env.n8n up -d

# ── Variables d'environnement partagées ──────────────────────────────────────
# Anchor séparé pour les variables d'env uniquement (pas la config service).
# Utilisé dans le bloc environment: des services n8n-main et n8n-worker.
x-n8n-env: &n8n-env
  # ── Base de données ─────────────────────────────────────────────────────────
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
  DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
  DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}

  # ── Queue mode (Redis) ───────────────────────────────────────────────────────
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ── Task Runner ─────────────────────────────────────────────────────────────
  N8N_RUNNERS_ENABLED: "true"
  N8N_RUNNERS_MODE: internal

  # ── Modules autorisés dans les Code nodes ───────────────────────────────────
  # DOIT être présent sur main ET worker (le worker exécute les Code nodes
  # en queue mode — c'est pour ça que crypto était bloqué).
  NODE_FUNCTION_ALLOW_BUILTIN: "crypto,path,url,util,os,querystring,stream,buffer,events,assert,zlib,https,http"
  NODE_FUNCTION_ALLOW_EXTERNAL: "*"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

  # ── Sécurité ─────────────────────────────────────────────────────────────────
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"

  # ── Timezone ─────────────────────────────────────────────────────────────────
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
  TZ: ${GENERIC_TIMEZONE:-Europe/Paris}

  # ── Mémoire ──────────────────────────────────────────────────────────────────
  NODE_OPTIONS: "--max-old-space-size=512"

# ── Config service commune (image, restart, réseau) ──────────────────────────
x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:1.93.0
  restart: unless-stopped
  env_file:
    - .env.n8n
  environment:
    <<: *n8n-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - soc_prod_net

# ════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE}
    volumes:
      - soc_postgres_data:/var/lib/postgresql/data
    networks:
      - soc_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: soc_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - soc_redis_data:/data
    networks:
      - soc_prod_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── n8n Main ──────────────────────────────────────────────────────────────────
  n8n-main:
    <<: *n8n-common
    container_name: soc_n8n_main
    environment:
      <<: *n8n-env
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_SAMESITE_COOKIE: lax
    ports:
      - "5678:5678"
    volumes:
      - soc_n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── n8n Worker ────────────────────────────────────────────────────────────────
  # En queue mode, les workflows s'exécutent ici.
  # NODE_FUNCTION_ALLOW_BUILTIN doit être présent ici aussi (c'est la cause
  # du bug "Module 'crypto' is disallowed").
  n8n-worker:
    <<: *n8n-common
    container_name: soc_n8n_worker
    entrypoint: ["n8n", "worker"]
    environment:
      <<: *n8n-env
      N8N_DISABLE_UI: "true"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - soc_n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n-main:
        condition: service_started

  # ── Cloudflare Tunnel ─────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:2025.1.0
    container_name: soc_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - soc_prod_net
    depends_on:
      - n8n-main

networks:
  soc_prod_net:
    driver: bridge

volumes:
  soc_postgres_data:
  soc_redis_data:
  soc_n8n_data:
