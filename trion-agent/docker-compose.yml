version: "3.8"

# trion-agent — two-container stack
#
# IMPORTANT : copier config.toml avant de démarrer :
#   cp config.toml.example config.toml
#   # éditer config.toml (LLM provider, Slack webhook, schedule…)
#   docker compose up -d --build
#
# Les données de scan persistent dans ./data/ sur l'hôte entre les redémarrages.
# Modifier config.toml sur l'hôte et relancer pour appliquer les changements.

services:

  dashboard:
    build: .
    container_name: trion-agent-dashboard
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data        # agent writes here, dashboard reads it
      - ./config.toml:/app/config.toml:ro
    restart: unless-stopped
    command: python3 agent_ui.py
    networks:
      - agent_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent:
    build: .
    container_name: trion-agent-scanner
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama on the host (Linux)
    volumes:
      - ./data:/app/data        # shares data dir with dashboard
      - ./config.toml:/app/config.toml:ro
    restart: unless-stopped
    command: python3 agent.py
    networks:
      - agent_net
    healthcheck:
      test: ["CMD-SHELL", "test -d /app/data"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  agent_net:
    driver: bridge
