<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Trion Agent{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  {% block body_wrap %}
  <div class="app">
    <!-- Sidebar nav -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">⬡</span>
        <span class="brand-name">Trion</span>
        <span class="brand-sub">Agent</span>
      </div>
      <ul class="nav-links">
        <li><a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
          <span class="nav-icon">◈</span> Dashboard
        </a></li>
        <li><a href="/history" class="nav-link {% if '/history' in request.url.path %}active{% endif %}">
          <span class="nav-icon">◷</span> History
        </a></li>
        <li><a href="/settings" class="nav-link {% if '/settings' in request.url.path %}active{% endif %}">
          <span class="nav-icon">◎</span> Settings
        </a></li>
      </ul>
      <div class="sidebar-footer">
        <a href="/logout" class="nav-link logout-link">
          <span class="nav-icon">⏻</span> Logout
        </a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
        <div class="topbar-meta">
          <span class="meta-chip">trion-agent</span>
        </div>
      </header>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  {% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
