version: "3.8"

# n8n 2.x — configuration production (Raspberry Pi / serveur local)
#
# Résout le problème "Module 'crypto' is disallowed" :
#   NODE_FUNCTION_ALLOW_BUILTIN doit être présent sur n8n-main ET n8n-worker
#   (en queue mode, les Code nodes s'exécutent sur le worker)
#
# Usage :
#   cp .env.n8n.example .env
#   # remplir .env
#   docker compose -f docker-compose.n8n-prod.yaml up -d
#
# Mise à jour :
#   docker compose -f docker-compose.n8n-prod.yaml pull
#   docker compose -f docker-compose.n8n-prod.yaml up -d

# ── Variables communes aux deux containers n8n ───────────────────────────────
x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    # ── Base de données ───────────────────────────────────────────────────
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: "5432"
    DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
    DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
    DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}

    # ── Queue mode (Redis) ────────────────────────────────────────────────
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: "6379"
    QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}

    # ── Task Runner — mode interne ────────────────────────────────────────
    # N8N_RUNNERS_MODE=internal : le runner tourne en sous-process de n8n.
    # Pas de container n8nio/runners séparé nécessaire.
    N8N_RUNNERS_ENABLED: "true"
    N8N_RUNNERS_MODE: internal

    # ── Modules autorisés dans les Code nodes ─────────────────────────────
    # DOIT être présent sur main ET worker (le worker exécute les Code nodes
    # en queue mode — c'est pour ça que crypto était bloqué).
    NODE_FUNCTION_ALLOW_BUILTIN: "crypto,path,url,util,os,querystring,stream,buffer,events,assert,zlib,https,http"
    NODE_FUNCTION_ALLOW_EXTERNAL: "*"
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

    # ── Sécurité ──────────────────────────────────────────────────────────
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"

    # ── Timezone ──────────────────────────────────────────────────────────
    GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
    TZ: ${GENERIC_TIMEZONE:-Europe/Paris}

    # ── Host inter-container (accès à l'hôte depuis un container) ─────────
    NODE_OPTIONS: "--max-old-space-size=512"

  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - n8n_net

# ════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: n8n_redis
    restart: unless-stopped
    # requirepass active l'authentification (REDIS_PASSWORD dans .env)
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - ./redis_data:/data
    networks:
      - n8n_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── n8n Main ───────────────────────────────────────────────────────────────
  n8n-main:
    <<: *n8n-common
    container_name: n8n_main
    environment:
      <<: *n8n-common  # hérite de x-n8n-common
      # URL publique (via Cloudflare tunnel)
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_SAMESITE_COOKIE: lax
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── n8n Worker ─────────────────────────────────────────────────────────────
  # En queue mode, les workflows s'exécutent ici.
  # NODE_FUNCTION_ALLOW_BUILTIN doit être présent ici aussi (c'est la cause
  # du bug "Module 'crypto' is disallowed").
  n8n-worker:
    <<: *n8n-common
    container_name: n8n_worker
    entrypoint: ["n8n", "worker"]
    environment:
      <<: *n8n-common  # hérite de x-n8n-common (inclut les NODE_FUNCTION_ALLOW_*)
      N8N_DISABLE_UI: "true"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n-main:
        condition: service_started

  # ── Cloudflare Tunnel ──────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: n8n_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - n8n_net
    depends_on:
      - n8n-main

networks:
  n8n_net:
    driver: bridge
