<!--
  Wazuh ossec.conf — bloc d'intégration n8n
  Ajouter dans /var/ossec/etc/ossec.conf, dans la section <ossec_config>.
  Remplacer N8N_HOST par l'IP/hostname de ta machine n8n.

  Après modification :
    systemctl restart wazuh-manager
    # ou : /var/ossec/bin/wazuh-control restart
-->

<ossec_config>

  <!-- ═══════════════════════════════════════════════════
       Intégration n8n : forward toutes les alertes >= 7
       ═══════════════════════════════════════════════════ -->
  <integration>
    <!-- Nom du script dans /var/ossec/integrations/ (doit commencer par "custom-") -->
    <name>custom-n8n</name>

    <!-- URL du webhook n8n soc-ingest -->
    <hook_url>http://N8N_HOST:5678/webhook/wazuh-ingest</hook_url>

    <!-- Optionnel : token passé en argv[2] au script (Authorization: Bearer) -->
    <!-- <api_key>MON_TOKEN_SECRET</api_key> -->

    <!-- Niveau minimum d'alerte à transmettre (7 = medium+, 10 = high+) -->
    <level>7</level>

    <!-- Format JSON obligatoire pour les scripts custom -->
    <alert_format>json</alert_format>
  </integration>

  <!-- ═══════════════════════════════════════════════════
       Seuils de logging et d'email (référence)
       ═══════════════════════════════════════════════════ -->
  <alerts>
    <!-- Niveau minimum écrit dans alerts.json / alerts.log -->
    <log_alert_level>3</log_alert_level>

    <!-- Niveau minimum pour les emails (si email configuré) -->
    <email_alert_level>12</email_alert_level>
  </alerts>

</ossec_config>
